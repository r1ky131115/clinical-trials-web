<div class="form-container">
    <a routerLink="/trials" class="back-link">← Volver</a>
    <h2>📝 Iniciar sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- email -->
        <div class="field">
            <label for="email">Correo electrónico</label>
            <input
                id="email"
                type="email"
                formControlName="email"
                placeholder="Ej: usuario@ejemplo.com"
                [class.invalid]="showError('email')"
            />
            @if (showError('email')) {
                <small class="error">{{ errorMessage('email') }}</small>
            }
        </div>

        <!-- password -->
        <div class="field">
            <label for="password">Contraseña</label>
            <input
                id="password"
                type="password"
                formControlName="password"
                placeholder="Tu contraseña"
                [class.invalid]="showError('password')"
            />
            @if (showError('password')) {
                <small class="error">{{ errorMessage('password') }}</small>
            }
        </div>
        
        <!-- Error general -->
        @if (submitError()) {
            <div class="alert error">{{ submitError() }}</div>
        }

        <!-- Submit -->
        <div class="actions">
            <a routerLink="/trials" class="btn-secondary">Cancelar</a>
            <button type="submit" [disabled]="submitting()" class="btn-primary">
            @if (submitting()) {
                ⏳ Guardando...
            } @else {
                Iniciar sesión
            }
            </button>
        </div>
    </form>
</div>
