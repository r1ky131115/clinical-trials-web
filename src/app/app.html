<div class="container">
  <h1>🧪 Clinical Trials Dashboard</h1>
  <p>Gestiona los estudios clínicos de tu organización</p>
  <div class="trials-list">
      @for (trial of trials; track trial.id) {
        <app-trial-card [trial]="trial" />
      } @empty {
        <p>No hay estudios cargados</p>
      }
  </div>
</div>
